name: Build and type-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check TypeScript
        run: npm run lint

      - name: Build frontend and production server
        run: npm run build

      - name: Compile Python engine modules
        run: python -m compileall -q engine

      - name: Test anonymous workspace isolation
        run: node --test tests/workspace-isolation.test.mjs
